spring.application.name=animal-registration-service
spring.config.import=file:animal-registration-service/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

server.port=8080
spring.mvc.servlet.path=/api/v1

# logging
logging.file.name=logs/animal-registration.log

logging.level.org.example.animalregistrationservice=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
